<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday 🎂</title>
    <link rel="shortcut icon" href="#">
    <link rel="stylesheet" href="./style.css">
</head>
<body class="text-center">
    <!-- بخش هرو (هدر) -->
    <div class="hero-section">
        <h1>🎂 تولدت مبارک ماه بانو</h1>
        <div id="cake-controls">
        <button id="start" class="button-30">🍰 بزن تا کیک بیاد!</button>
        </div>
    </div>
    <div class="container">
        <!-- <h1>🎂 تولدت مبارک ماه بانو</h1>
        
        <div id="cake-controls">
            <button id="start" class="button-30">Reveal Cake 🍰</button>
        </div> -->

        <div class="cake-message text-center">
            <h5 class="cake-off">❣ Happy Birthday Dude ❣</h5>
            <p class="cake-off">
                ❤ Love you to the moon and back ❤
            </p>
        </div>


        <div id="cake-holder">
            
            <div class="cake">
                <div class="plate"></div>
                <div class="layer layer-bottom"></div>
                <div class="layer layer-middle"></div>
                <div class="layer layer-top"></div>
                <div class="icing"></div>
                <div class="drip drip1"></div>
                <div class="drip drip2"></div>
                <div class="drip drip3"></div>

                <div class="candle">
                    <!-- ستاره‌ها را در همین جا قرار می‌دهیم -->
                    <div class="star-group">
                        <div class="star"></div>
                        <div class="star"></div>
                        <div class="star"></div>
                        <div class="star"></div>
                        <div class="star"></div>
                    </div>

                    <div class="flame"></div>
                </div>
            </div>

            
        </div>
<!-- *********************************************************************** -->
        <!-- <div class="birthday-alert" id="birthdayAlert">
            💕❤️💨 تولدت مبارک حاش خانوم 
        </div> -->
<!-- *********************************************************************** -->

        <div id="microphone-controls" style="display: none;">
            <button id="blow-candle" class="button-30">Blow Out Candle 💨</button>
        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
