<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Cake 🎂</title>
    <link rel="shortcut icon" href="#">
    <link rel="stylesheet" href="./style.css">
</head>
<body class="text-center">
    <div class="container">
        <h1>Birthday Cake 🎂</h1>
        
        <div id="cake-controls">
            <button id="start" class="button-30">Reveal Cake 🍰</button>
        </div>

        <div id="cake-holder" style="opacity: 0">
            <div class="cake">
                <div class="plate"></div>
                <div class="layer layer-bottom"></div>
                <div class="layer layer-middle"></div>
                <div class="layer layer-top"></div>
                <div class="icing"></div>
                <div class="drip drip1"></div>
                <div class="drip drip2"></div>
                <div class="drip drip3"></div>
                <div class="candle">
                    <div class="flame"></div>
                </div>
            </div>
            
            <div class="cake-message text-center">
                <h5 class="cake-off">❣ Happy Birthday Dude ❣</h5>
                <p class="cake-off">❤ Wish you best ❤</p>
            </div>
        </div>

        <div id="microphone-controls" style="display: none;">
            <button id="blow-candle" class="button-30">Blow Out Candle 💨</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="cake.js"></script>
    <script src="audioStream.js"></script>
    <script src="audioDetection.js"></script>
    <script src="demo.js"></script>
</body>
</html>
