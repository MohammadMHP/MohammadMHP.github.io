<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <title>Music Player with Slider | Swiper JS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css'>
<link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css'><link rel="stylesheet" href="./Player.css">

</head>
<body>
<!-- partial:index.partial.html -->
<body>
    <div class="album-cover">
      <div class="swiper">
        <div class="swiper-wrapper">
          <div class="swiper-slide">
            <img
              src="../pic/02.jpg" />
            <div class="overlay">
            </div>
          </div>
          
          <div class="swiper-slide">
            <img
              src="../pic/06.jpg" />
            <div class="overlay">
            </div>
          </div>
          
          <div class="swiper-slide">
            <img
              src="../pic/07.jpg" />
            <div class="overlay">
            </div>
          </div>
          
          <div class="swiper-slide">
            <img
              src="../pic/01.jpg" />
            <div class="overlay">
            </div>
          </div>
          
          <div class="swiper-slide">
            <img
              src="../pic/05.jpg" />
            <div class="overlay">
            </div>
          </div>
          
          <div class="swiper-slide">
            <img
              src="../pic/04.jpg" />
            <div class="overlay">
            </div>
          </div>
          
          <div class="swiper-slide">
            <img
              src="../pic/03.jpg" />
            <div class="overlay">
            </div>
          </div>
          
        </div>
      </div>
    </div>

    <div class="music-player">
      <h1>Title</h1>
      <p>Song Name</p>

      <audio id="song">
        <source src="song-list/Luke-Bergs-Gold.mp3" type="audio/mpeg" />
      </audio>

      <input type="range" value="0" id="progress" />

      <div class="controls">
        <button class="backward">
          <i class="fa-solid fa-backward"></i>
        </button>
        <button class="play-pause-btn">
          <i class="fa-solid fa-play" id="controlIcon"></i>
        </button>
        <button class="forward">
          <i class="fa-solid fa-forward"></i>
        </button>
      </div>
    </div>
  </body>
<!-- partial -->
  <script src='https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js'></script>
  <script src='https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js'></script>
  <script src='https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js'></script><script  src="./Player.js"></script>

</body>
</html>
